name: labeler
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
# One run per pull request: a newer push supersedes the labels of the older one.
concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # actions/labeler adds the path labels to the pull request
    steps:
      # Only reads the list of changed files; it never checks out or runs pull request code.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
