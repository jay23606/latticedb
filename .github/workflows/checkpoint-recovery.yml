name: checkpoint-recovery
# Deliberate fresh-process measurements; no recurring or pull-request load.
on:
  workflow_call:
    inputs:
      repeats: { type: string, default: "3", required: false }
      memory_mib: { type: string, default: "192", required: false }
  workflow_dispatch:
    inputs:
      repeats:
        description: Fresh recovery processes per mode/dataset (1 to 5)
        default: "3"
        required: true
      memory_mib:
        description: Enforced cgroup v2 ceiling per recover process tree (64 to 2048 MiB)
        default: "192"
        required: true
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1, components: clippy }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { shared-key: checkpoint-recovery }
      - name: runner and memory controller context
        run: |
          mkdir -p checkpoint-evidence
          uname -a | tee checkpoint-evidence/uname.txt
          lscpu > checkpoint-evidence/lscpu.txt
          df -T "$RUNNER_TEMP" > checkpoint-evidence/filesystem.txt
          cat /sys/fs/cgroup/cgroup.controllers > checkpoint-evidence/cgroup-controllers.txt
          cat /sys/fs/cgroup/cgroup.subtree_control > checkpoint-evidence/cgroup-subtree-control.txt
          /usr/bin/time --version > checkpoint-evidence/time-version.txt
      - name: independently reproduce format fixtures
        run: |
          python3 -m venv "$RUNNER_TEMP/checkpoint-python"
          "$RUNNER_TEMP/checkpoint-python/bin/python" -m pip install --only-binary=:all: blake3==1.0.11
          "$RUNNER_TEMP/checkpoint-python/bin/python" formats/generate_checkpoint_golden.py --check
      - name: focused correctness and probe lint
        run: |
          cargo test -p lattice-core -p lattice-engines
          cargo clippy -p lattice-core -p lattice-engines -p lattice-bench --all-targets -- -D warnings
          cargo build --release -p lattice-bench --example checkpoint_probe
      - name: fresh-process recovery and enforced memory ceiling
        env:
          REPEATS: ${{ inputs.repeats }}
          MEMORY_MIB: ${{ inputs.memory_mib }}
        run: |
          set -o pipefail
          python3 tools/checkpoint_recovery_measure.py \
            --probe target/release/examples/checkpoint_probe \
            --datasets "$RUNNER_TEMP/checkpoint-datasets" \
            --output checkpoint-evidence --repeats "$REPEATS" --memory-mib "$MEMORY_MIB" \
            | tee checkpoint-evidence/run.log
          cat checkpoint-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checkpoint-recovery-${{ github.sha }}
          path: checkpoint-evidence
          if-no-files-found: error
