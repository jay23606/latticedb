[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "lazy_static" },
  # anyhow is banned in core, engines and service (use thiserror enums); tools may use it.
  { name = "anyhow", wrappers = ["xtask", "lattice-cli", "latticed"] },
]
